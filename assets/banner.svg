<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Stream Beam Gradients -->
    <linearGradient id="beam1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="beam2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- High-Contrast Text Drop Shadow -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <filter id="subShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -0.5px;
    }
    .brand-subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
    }
    .category-label {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 2px;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Deep Tech Background Canvas -->
  <rect width="960" height="280" rx="16" fill="url(#bgGrad)"/>
  <rect width="958" height="278" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Dynamic Event Flow Paths (Background Layer) -->
  <g opacity="0.6">
    <path d="M 40 60 C 240 20, 460 95, 680 50 S 860 80, 920 60" 
          fill="none" stroke="url(#beam1)" stroke-width="2.5" stroke-dasharray="18 12">
      <animate attributeName="stroke-dashoffset" from="600" to="0" dur="14s" repeatCount="indefinite" />
    </path>
    <path d="M 40 220 C 230 255, 470 175, 710 225 S 860 205, 920 215" 
          fill="none" stroke="url(#beam2)" stroke-width="2" stroke-dasharray="14 18">
      <animate attributeName="stroke-dashoffset" from="0" to="600" dur="16s" repeatCount="indefinite" />
    </path>
    <path d="M 40 140 C 280 190, 620 90, 920 140" 
          fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" from="400" to="0" dur="20s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Animated Data Stream Packets (Native SMIL for 100% Cross-Platform & GitHub Camo Reliability) -->
  <g>
    <!-- Packet 1: Top Stream -->
    <circle r="4" fill="#38bdf8" filter="url(#glow)">
      <animateMotion path="M 40 60 C 240 20, 460 95, 680 50 S 860 80, 920 60" 
                     dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="7s" repeatCount="indefinite" />
    </circle>
    <!-- Packet 2: Top Stream (Staggered) -->
    <circle r="3" fill="#818cf8" filter="url(#glow)">
      <animateMotion path="M 40 60 C 240 20, 460 95, 680 50 S 860 80, 920 60" 
                     dur="9s" begin="-3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="9s" begin="-3.5s" repeatCount="indefinite" />
    </circle>
    <!-- Packet 3: Bottom Stream (Reversed) -->
    <circle r="3.5" fill="#f472b6" filter="url(#glow)">
      <animateMotion path="M 920 215 S 860 205, 710 225 C 470 175, 230 255, 40 220" 
                     dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="8s" repeatCount="indefinite" />
    </circle>
    <!-- Packet 4: Middle Stream -->
    <circle r="3.5" fill="#38bdf8" filter="url(#glow)">
      <animateMotion path="M 40 140 C 280 190, 620 90, 920 140" 
                     dur="11s" begin="-5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.9;1" dur="11s" begin="-5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Pulsing Hub Nodes (Hardware & Cluster Topology) -->
  <g transform="translate(150, 75)">
    <circle cx="0" cy="0" r="14" fill="#38bdf8" fill-opacity="0.1">
      <animate attributeName="r" values="10;18;10" dur="3s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.15;0.03;0.15" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="3.5" fill="#38bdf8" />
  </g>

  <g transform="translate(810, 75)">
    <circle cx="0" cy="0" r="14" fill="#818cf8" fill-opacity="0.1">
      <animate attributeName="r" values="10;18;10" dur="3.5s" begin="-1s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.15;0.03;0.15" dur="3.5s" begin="-1s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="3.5" fill="#818cf8" />
  </g>

  <g transform="translate(790, 215)">
    <circle cx="0" cy="0" r="14" fill="#c084fc" fill-opacity="0.1">
      <animate attributeName="r" values="10;18;10" dur="3.2s" begin="-1.8s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.15;0.03;0.15" dur="3.2s" begin="-1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="3.5" fill="#c084fc" />
  </g>

  <!-- Floating Ambient Tag Badges (Top Left & Top Right) -->
  <g transform="translate(68, 28)">
    <rect width="142" height="24" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#10b981"/>
    <text x="26" y="16" fill="#94a3b8" class="badge-text">KAFKA PROTOCOL</text>
  </g>

  <g transform="translate(740, 28)">
    <rect width="150" height="24" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#38bdf8"/>
    <text x="26" y="16" fill="#94a3b8" class="badge-text">HIGH THROUGHPUT</text>
  </g>

  <!-- FOREGROUND LAYER: Text & Badges prominently in foreground, high contrast, non-obscured -->
  <g id="foreground-layer">
    <!-- Super-title Category -->
    <text x="480" y="84" 
          text-anchor="middle" 
          fill="#38bdf8" 
          class="category-label">
      DISTRIBUTED SYSTEMS &#8226; STREAM PROCESSING &#8226; CLOUD PUBSUB
    </text>

    <!-- Main Title with high-contrast shadow -->
    <text x="480" y="130" 
          text-anchor="middle" 
          fill="url(#titleGrad)" 
          filter="url(#textShadow)"
          class="brand-title">
      Awesome Event Streaming Clients
    </text>

    <!-- Subtitle -->
    <text x="480" y="166" 
          text-anchor="middle" 
          fill="#f1f5f9" 
          filter="url(#subShadow)"
          class="brand-subtitle">
      Curated Directory of Cloud Streaming Platforms, Kafka Wire-Protocol Clients &amp; Pipelines
    </text>

    <!-- Ecosystem Pillars in foreground -->
    <g transform="translate(135, 202)">
      <!-- Pill 1 -->
      <g>
        <rect width="190" height="32" rx="16" fill="#0f172a" fill-opacity="0.95" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.2"/>
        <text x="95" y="20" text-anchor="middle" fill="#7dd3fc" class="pill-text">&#9889; Managed SaaS &amp; Brokers</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(208, 0)">
        <rect width="220" height="32" rx="16" fill="#0f172a" fill-opacity="0.95" stroke="#818cf8" stroke-opacity="0.45" stroke-width="1.2"/>
        <text x="110" y="20" text-anchor="middle" fill="#a5b4fc" class="pill-text">&#128268; Multi-Language Clients</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(446, 0)">
        <rect width="230" height="32" rx="16" fill="#0f172a" fill-opacity="0.95" stroke="#c084fc" stroke-opacity="0.45" stroke-width="1.2"/>
        <text x="115" y="20" text-anchor="middle" fill="#e9d5ff" class="pill-text">&#128202; Pricing &amp; Star Analytics</text>
      </g>
    </g>
  </g>
</svg>
